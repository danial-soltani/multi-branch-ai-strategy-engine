est.response_fixture);\n    assertClock(observation);report.clock_profile.actual_preflight_passed=true;\n    report.status='OBSERVATION_RECORDED';report.phase='COMPLETE';\n  }catch(error){report.error={name:error.name??'UNKNOWN',message:String(error.message??'UNKNOWN').slice(0,600)};}\n  finally{\n    if(Expression){try{await Expression.disposeExpressionEngine();report.expression_cleanup_confirmed=true;}\n      catch{report.expression_cleanup_confirmed=false;report.status='BLOCKED';}}\n  }\n  return report;\n}\nmodule.exports={runOnce};\n", 'request_gate.cjs': "'use strict';\nconst {selectDigest}=require('./digest_policy.cjs');\nconst {NOW,CUTOFF}=require('./source_gate.cjs');\nconst ASSET='dc642c84432e7a5c935090a202410fe3866832e61a618ec4804c854eeb0396ab';\nfunction validateRequest(r){\n  const reject=()=>{throw new Error('REQUEST_REJECTED');};\n  if(!r||JSON.stringify(Object.keys(r).sort())!==JSON.stringify(['schema','label','binding','delivered','revision','intent_id','mode','response_fixture','operational_use_allowed'].sort()))reject();\n  if(r.schema!=='restart-run-v1'||!['baseline_1','baseline_2','clean_first','clean_restart','error_429','crash_ack','isolated_beta'].includes(r.label)||\n     !r.binding||JSON.stringify(Object.keys(r.binding).sort())!==JSON.stringify(['asset_sha','instance_id'])||r.binding.asset_sha!==ASSET||\n     !/^[a-z][a-z0-9_-]{0,63}$/.test(r.binding.instance_id)||!Number.isInteger(r.revision)||r.revision<0||\n     !(r.intent_id===null||typeof r.intent_id==='string'&&/^[a-f0-9]{32}$/.test(r.intent_id))||r.operational_use_allowed!==false||\n     !['normal','kill_after_ack'].includes(r.mode)||(r.mode==='kill_after_ack')!==(r.label==='crash_ack')||\n     !['slack_ok.json','slack_rate_limit.json'].includes(r.response_fixture))reject();\n  if(!Array.isArray(r.delivered)||new Set(r.delivered).size!==r.delivered.length)throw new Error('DELIVERY_STATE_REJECTED');\n  selectDigest([],{cutoff:Date.parse(CUTOFF),now:Date.parse(NOW),delivered:r.delivere