name: Sol Solly environment probe
on:
  push:
    branches: [sol-solly/environment-probe]
    paths: [.github/workflows/sol-solly-environment-probe.yml]
permissions: {}
concurrency:
  group: sol-solly-environment-probe
  cancel-in-progress: false
jobs:
  environment:
    if: github.repository == 'danial-soltani/multi-branch-ai-strategy-engine' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prove bounded restart checkpoint with isolated fresh containers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'HISTORICAL_PROJECTION_PY'
          OWNED_FILES = {'restart_adapter.cjs': "'use strict';\nconst fs=require('node:fs'),path=require('node:path'),os=require('node:os'),net=require('node:net');\nconst {createRequire}=require('node:module');\nconst {createBridge}=require('./mock_bridge.cjs');\nconst {SOURCE_SHA,NOW,CUTOFF,sha,clockShim,assertClock}=require('./source_gate.cjs');\nconst {validateRequest,ASSET}=require('./request_gate.cjs');\nconst {makeAdaptation,GUARD,ACK}=require('./adaptation.cjs');\nconst DATE='Get Yesterdays Date',RSS='Get the RSS Feed',FILTER='If it was published after yesterday',FUNC='Build our message',SLACK='Post to Slack';\nconst deny=()=>{throw new Error('CAPABILITY_NOT_AVAILABLE_IN_ADAPTATION_TEST');};\n\nfunction proxiedContext(context,nodeType,active){\n  const helpers=context.helpers;\n  const network=new Set(['httpRequest','httpRequestWithAuthentication','request','requestWithAuthentication','httpRequestPagination','httpRequestWithAuthenticationPaginate']);\n  const proxyHelpers=new Proxy(helpers,{get(target,key){\n    if(network.has(key)){\n      if(nodeType==='rssFeedRead'&&key==='httpRequest')return active.bridge.httpRequest;\n      if(nodeType==='slack'&&key==='requestWithAuthentication')return active.bridge.requestWithAuthentication;\n      return deny;\n    }\n    const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;\n  }});\n  return new Proxy(context,{get(target,key){\n    if(key==='helpers')return proxyHelpers;\n    const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;\n  }});\n}\n\nasync function egressObservation(){\n  const connection=await new Promise(resolve=>{\n    const socket=net.createConnection({host:'198.51.100.1',port:443});\n    const timer=setTimeout(()=>{socket.destroy();resolve({outcome:'TIMEOUT',error_code:null});},1500);\n    socket.once('connect',()=>{clearTimeout(timer);socket.destroy();resolve({outcome:'UNEXPECTED_CONNECT',error_code:null});});\n    socket.once('error',error=>{clearTimeout(timer);socket.destroy();resolve({outcome:'DENIED',error_code:error.code});});\n  });\n  const processStatus=fs.readFileSync('/proc/self/status','utf8');\n  return {numeric_documentation_address_probe:connection,\n    only_loopback_interfaces:JSON.stringify(Object.keys(os.networkInterfaces()))===JSON.stringify(['lo']),\n    non_root:process.getuid()===1000&&process.getgid()===1000,\n    no_new_privileges:/^NoNewPrivs:\\s+1$/m.test(processStatus),\n    no_effective_capabilities:/^CapEff:\\s+0+$/m.test(processStatus),\n    host_marker_absent:!Object.hasOwn(process.env,'HOST_ONLY_MARKER'),\n    docker_socket_absent:!fs.existsSync('/var/run/docker.sock')};\n}\n\nasync function runOnce(bytes,fixtures,request,requestSha){\n  validateRequest(request);\n  const input=makeAdaptation(bytes);\n  if(input.adaptation_sha256!==ASSET)throw new Error('ADAPTATION_HASH_MISMATCH');\n  const report={scope:'PINNED_RESTART_OBSERVATION',status:'BLOCKED',source_sha256:SOURCE_SHA,\n    projection_sha256:input.adaptation_sha256,original_projection_sha256:input.original_projection_sha256,change_manifest:input.change_manifest,source_file_unchanged:true,\n    logic_parameters_and_connections_unchanged:input.logic_parameters_and_connections_unchanged,\n    scheduler_activated:false,test_entry_node:DATE,engine_loaded:false,runs:[],request,request_sha256:requestSha,\n    adaptation_engine_attempts:0,operational_use_allowed:false,commercial_license_clearance:'UNKNOWN',\n    verification_scope:'CONTROLLED_ADAPTATION_MOCK_TESTS_ONLY',phase:'LOAD_REAL_RUNTIME'};\n  let Expression;\n  try{\n    const cli='/usr/local/lib/node_modules/n8n/package.json',req=createRequire(cli);\n    const versions={n8n:'2.45.7','n8n-core':'2.45.6','n8n-workflow':'2.45.4','n8n-nodes-base':'2.45.6'};\n    report.module_evidence={};const roots={};\n    for(const [name,version]of Object.entries(versions)){\n      const filename=name==='n8n'?cli:req.resolve(name+'/package.json'),raw=fs.readFileSync(filename),meta=JSON.parse(raw);\n      if(meta.name!==name||meta.version!==version)throw new Error('PACKAGE_VERSION_MISMATCH');\n      roots[name]=path.dirname(filename);report.module_evidence[name]={version:meta.version,package_json_path:filename,sha256:sha(raw),declared_license:meta.license??'UNKNOWN'};\n    }\n    req('reflect-metadata');\n    const api=req('n8n-workflow'),core=req('n8n-core');Expression=api.Expression;\n    report.node_version=process.versions.node;\n    const definitions={cron:['Cron/Cron.node.js','Cron'],dateTime:['DateTime/DateTime.node.js','DateTime'],\n      rssFeedRead:['RssFeedRead/RssFeedRead.node.js','RssFeedRead'],if:['If/If.node.js','If'],\n      function:['Function/Function.node.js','Function'],slack:['Slack/Slack.node.js','Slack']};\n    let active;\n    const types=new Map();report.node_implementation_evidence={};\n    for(const [type,[file,exported]]of Object.entries(definitions)){\n      const filename=path.join(roots['n8n-nodes-base'],'dist/nodes',file);\n      const top=new (req(filename)[exported])();\n      const actual=api.NodeHelpers.getVersionedNodeType(top,1);\n      const wrapped=Object.create(actual);\n      if(typeof actual.execute==='function')wrapped.execute=async function(...args){\n        if(!active)throw new Error('TEST_CONTEXT_MISSING');\n        if(type==='dateTime')active.date_resolution={value:this.getNodeParameter('value',0),\n          timeUnit:this.getNodeParameter('timeUnit',0),dataPropertyName:this.getNodeParameter('dataPropertyName',0)};\n        return await actual.execute.apply(proxiedContext(this,type,active),args);\n      };\n      types.set('n8n-nodes-base.'+type,wrapped);\n      const legacy={dateTime:'DateTime/V1/DateTimeV1.node.js',if:'If/V1/IfV1.node.js',slack:'Slack/V1/SlackV1.node.js'};\n      const implementation=legacy[type]?path.join(roots['n8n-nodes-base'],'dist/nodes',legacy[type]):filename;\n      report.node_implementation_evidence[type]={version:1,loader_path:filename,loader_sha256:sha(fs.readFileSync(filename)),\n        implementation_path:implementation,implementation_sha256:sha(fs.readFileSync(implementation)),\n        execute_present:typeof actual.execute==='function',trigger_present:typeof actual.trigger==='function',\n        helper_interception:['rssFeedRead','slack'].includes(type)?'NETWORK_TRANSPORT_ONLY':'NETWORK_HELPERS_DENIED'};\n    }\n    const nodeTypes={getByName(name){if(!types.has(name))throw new Error('NODE_REGISTRY_REJECTED');return types.get(name);},\n      getByNameAndVersion(name,version){if(version!==undefined&&version!==1)throw new Error('NODE_VERSION_REJECTED');return this.getByName(name);},\n      getKnownTypes(){return Object.fromEntries([...types].map(([name,node])=>[name,node.description]));}};\n    const workflowReq=createRequire(path.join(roots['n8n-workflow'],'package.json'));\n    let location=path.dirname(workflowReq.resolve('@n8n/expression-runtime')),bundle;\n    for(let i=0;i<7;i++){\n      const candidate=path.join(location,'dist/bundle/runtime.iife.js');\n      if(fs.existsSync(candidate)){bundle=candidate;break;}\n      location=path.dirname(location);\n    }\n    if(!bundle)throw new Error('RUNTIME_BUNDLE_NOT_FOUND');\n    const originalBundle=fs.readFileSync(bundle,'utf8'),instrumented=clockShim+originalBundle;\n    report.clock_profile={frozen_now:NOW,cutoff:CUTOFF,timezone:'UTC',host_date:'NATIVE_UNFROZEN',\n      expression_date_only:'QUICKJS_SUPPORTED_RUNTIME_BUNDLE_WITH_PREPENDED_TEST_SHIM',original_bundle_path:bundle,original_bundle_sha256:sha(originalBundle),\n      clock_shim_sha256:sha(clockShim),instrumented_bundle_sha256:sha(instrumented),\n      os_clock_frozen:false,engine_files_modified:false};\n    report.engine_loaded=true;report.phase='CLOCK_AND_QUICKJS_SETUP';\n    const hostBefore=Date.now();await new Promise(resolve=>setTimeout(resolve,20));\n    report.clock_profile.host_clock_progress_ms=Date.now()-hostBefore;\n    if(report.clock_profile.host_clock_progress_ms<=0)throw new Error('HOST_CLOCK_NOT_PROGRESSING');\n    await Expression.initExpressionEngine({engine:'quickjs',poolSize:1,maxCodeCacheSize:100,bridgeTimeout:3000,\n      bridgeMemoryLimit:128,runtimeBundle:instrumented,nativeEvaluation:false});\n    report.expression_engine_observed=Expression.getActiveImplementation();\n    if(report.expression_engine_observed!=='quickjs')throw new Error('EXPRESSION_ENGINE_MISMATCH');\n    report.fixture_sha256=Object.fromEntries(Object.entries(fixtures).map(([name,content])=>[name,sha(content)]));\n    report.phase='REAL_ADAPTED_NODE_EXECUTIONS';\n    report.isolation_observation=await egressObservation();\n    const snapshotState=workflow=>workflow.staticData===undefined?null:sha(JSON.stringify(workflow.staticData));\n    async function execute(label,xmlName,responseName='slack_ok.json',existing){\n      const bridge=createBridge({rssXml:fixtures[xmlName],slackResponse:JSON.parse(fixtures[responseName])});\n      active={bridge,date_resolution:null};\n      const workflow=new api.Workflow({...structuredClone(input.projection),nodeTypes,staticData:{global:{sol_solly_digest_v1:structuredClone(request.delivered)}}});\n      const trace=[],hooks=new core.ExecutionLifecycleHooks('manual','owned-'+label,input.projection);\n      hooks.addHandler('nodeExecuteAfter',async(name,data,execution)=>{\n        trace.push({name,status:data.executionStatus});\n        if(request.mode==='kill_after_ack'&&name===ACK&&data.executionStatus==='success'){\n          const date_output=execution?.resultData?.runData[DATE]?.[0]?.data?.main?.[0]?.map(item=>item.json)??null;\n          assertClock({date_output,date_resolution:active.date_resolution});report.clock_profile.actual_preflight_passed=true;\n          const transport=bridge.snapshot(),delivery_state=JSON.parse(JSON.stringify(workflow.staticData.global.sol_solly_digest_v1));\n          if(transport.slack_requests!==1||request.response_fixture!=='slack_ok.json'||!delivery_state.includes('guid:rec