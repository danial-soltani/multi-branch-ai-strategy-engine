                      with opener.open(urllib.request.Request(SOURCE_URL,headers={'User-Agent':'owned-pinned-source-acquisition'}),timeout=20) as response:source=response.read(1048577)
                      if hashlib.sha256(source).hexdigest()!=SOURCE_SHA:raise GateError('SOURCE_HASH_REJECTED')
                  except (OSError,ValueError,GateError):return {**result,'blocker':'SOURCE_ACQUISITION_BLOCKED'}
                  fixtures=json.loads(files['fixtures.json']);result['source_url']=SOURCE_URL
                  env={'PATH':os.defpath,'HOME':str(client),'DOCKER_CONFIG':str(client/'docker'),'HOST_ONLY_MARKER':'synthetic-do-not-forward'}
