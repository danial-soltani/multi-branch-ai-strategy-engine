                  if any(case['proposed_policy_result']!=('UNKNOWN' if case['id']=='T12' else 'PASS') for case in cases):raise GateError('ENGINE_REPORT_REJECTED')
                  expected_runs={'window','duplicates','repeat_first','repeat_second','empty','malformed','invalid_date','untrusted_text','missing_fields','slack_success','slack_429','slack_error','429_recovered','429_repeat_after_ack','error_recovered','error_repeat_after_ack'}
                  if value.get('adaptation_engine_attempts')!=16 or len(value['runs'])!=16 or {run['label'] for run in value['runs']}!=expected_runs:raise GateError('ENGINE_REPORT_REJECTED')
                  return True
              except (KeyError,TypeError,ValueError,AttributeError):
                  raise GateError('ENGINE_REPORT_REJECTED') from None

          def env_map(entries):
              result = {}
              for entry in entries:
                  key, value = entry.split('=', 1)
                  if key in result: raise GateError('CONTAINER_CONFIG_REJECTED')
                  result[key] = value
              return result

          def validate_config(info, image_id, source, expected_env):
              def require(condition):
                  if not condition: raise GateError('CONTAINER_CONFIG_REJECTED')
              try:
                  c,h = info['Config'],info['HostConfig']
                  require(info['Image']==image_id and info['State']['Status']=='created')
                  require(c['Image']==IMAGE and c['User']=='1000:1000')
                  require(c['Entrypoint']==['node'] and c['Cmd']==['--no-node-snapshot','/probe/runner.cjs'] and c['WorkingDir']=='/tmp')
                  require(h['NetworkMode']=='none' and h['Privileged'] is False and h['ReadonlyRootfs'] is True)
                  require(h['CapDrop']==['ALL'] and not h.get('CapAdd') and h['SecurityOpt']==['no-new-privileges:true'])
                  require(h['IpcMode']=='none' and h['PidMode']=='')
                  for key,value in {'Memory':2147483648,'MemorySwap':2147483648,'PidsLimit':128,'NanoCpus':1000000000}.items():
                      require(type(h[key]) is int and h[key]==value)
                  for key in ['PortBindings','Devices','DeviceRequests','Binds','VolumesFrom','ExtraHosts']:
                      require(not h.get(key))
                  require(h['Tmpfs']=={'/tmp':TMPFS})
                  mounts=info['Mounts']
                  require(isinstance(mounts,list) and len(mounts) in (1,2))
                  binds=[m for m in mounts if m['Type']=='bind']
                  temporary=[m for m in mounts if m['Type']=='tmpfs']
                  require(len(binds)==1 and len(temporary)<=1 and len(binds)+len(temporary)==len(mounts))
                  require(binds[0]['Source']==source and binds[0]['Destination']=='/probe' and binds[0]['RW'] is False)
                  for mount in temporary:
                      require(mount['Destination']=='/tmp' and not mount.get('Source') and mount['RW'] is True)
                  require(env_map(c['Env'])==expected_env)
                  return True
              except (KeyError,TypeError,ValueError,IndexError,AttributeError):
                  raise GateError('CONTAINER_CONFIG_REJECTED') from None

          def run_adaptation(files):
              result={'scope':'RESTRICTED_TEST_ADAPTATION', 'status':'BLOCKED', 'image_ref':IMAGE,
                'configuration_gate_passed':False, 'container_cleanup_confirmed':None,
                'engine_report':None, 'adaptation_engine_attempts':None,
                'operational_use_allowed':False, 'sandbox_security_verified':False}
              if set(files)!={'adapted_adapter.cjs','source_gate.cjs','mock_bridge.cjs','adapted_policy.cjs','runner.cjs','fixtures.json','digest_policy.cjs','adaptation.cjs'}:
                  return {**result,'blocker':'INPUT_FILE_SET_REJECTED'}
              result['input_sha256']={name:hashlib.sha256(content.encode()).hexdigest() for name,content in files.items()}
              docker=shutil.which('docker')
              if not docker: return {**result,'blocker':'DOCKER_MISSING'}
              with tempfile.TemporaryDirectory(prefix='owned-engine-') as work:
                  root=Path(work); inputs=root/'probe'; inputs.mkdir(mode=0o755)
                  for name,content in files.items():
                      (inputs/name).write_text(content); (inputs/name).chmod(0o644)
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self,request,fp,code,msg,headers,newurl):
                          raise GateError('SOURCE_REDIRECT_REJECTED')
                  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
                  try:
                      with opener.open(urllib.request.Request(SOURCE_URL,headers={'User-Agent':'owned-static-source-acquisition'}),timeout=20) as response:
                          source_bytes=response.read(1048577)
                      if hashlib.sha256(source_bytes).hexdigest()!=SOURCE_SHA:
                          return {**result,'blocker':'SOURCE_HASH_REJECTED'}
                  except (OSError,ValueError,GateError):
                      return {**result,'blocker':'SOURCE_ACQUISITION_BLOCKED'}
                  (inputs/'historical_source.json').write_bytes(source_bytes)
                  (inputs/'historical_source.json').chmod(0o644)
                  result['source_url']=SOURCE_URL; result['source_sha256']=SOURCE_SHA
                  result['input_sha256']['historical_source.json']=SOURCE_SHA
                  client=root/'client'; client.mkdir()
                  clean_env={'PATH':os.defpath,'HOME':str(client),'DOCKER_CONFIG':str(client/'docker'),
                             'HOST_ONLY_MARKER':'synthetic-do-not-forward'}
                  def command(args,timeout=25,accept_failure=False):
                      try:
                          response=subprocess.run([docker,*args],capture_output=True,text=True,timeout=timeout,env=clean_env,check=False)
                      except (OSError,subprocess.TimeoutExpired): raise GateError('DOCKER_COMMAND_ERROR') from None
                      if response.returncode and not accept_failure: raise GateError('DOCKER_COMMAND_FAILED')
                      return response
                  name='sol-solly-owned-engine-'+uuid.uuid4().hex
                  create_attempted=False
                  try:
                      command(['pull','--platform','linux/amd64',IMAGE],timeout=180)
                      image=json.loads(command(['image','inspect',IMAGE]).stdout)[0]
                      image_id=image['Id']
                      if image.get('Os')!='linux' or image.get('Architecture')!='amd64' or not re.fullmatch(r'sha256:[0-9a-f]{64}',image_id):
                          raise GateError('IMAGE_METADATA_REJECTED')
                      if not any(ref.split('@')[-1]==IMAGE.split('@')[1] for ref in image.get('RepoDigests',[])):
                          raise GateError('IMAGE_DIGEST_REJECTED')
                      expected_env=env_map(image['Config'].get('Env',[])); expected_env.update(OVERRIDES)
                      result['image_id']=image_id
                      args=['create','--name='+name,'--pull=never','--platform=linux/amd64','--network=none',
                        '--read-only','--cap-drop=ALL','--security-opt=no-new-privileges:true','--ipc=none',
                        '--memory=2g','--memory-swap=2g','--pids-limit=128','--cpus=1',
                        '--user=1000:1000','--workdir=/tmp','--tmpfs=/tmp:'+TMPFS,
                        '--mount=type=bind,src='+str(inputs)+',dst=/probe,readonly','--entrypoint=node']
                      args.extend('--env='+key+'='+value for key,value in OVERRIDES.items())
                      args.extend([IMAGE,'--no-node-snapshot','/probe/runner.cjs'])
                      create_attempted=True
                      created=command(args).stdout.strip()
                      if not re.fullmatch(r'[0-9a-f]{64}',created): raise GateError('CONTAINER_ID_REJECTED')
                      validate_config(json.loads(command(['inspect',name]).stdout)[0],image_id,str(inputs),expected_env)
                      result['configuration_gate_passed']=True
                      execution=command(['start','--attach',name],timeout=90,accept_failure=True)
                      result['container_process_exit_code']=execution.returncode
                      result['runtime_stdout_sha256']=hashlib.sha256(execution.stdout.encode()).hexdigest()
                      frames=[line[len('ADAPTED_N8N_REPORT_V1='):] for line in execution.stdout.splitlines() if line.startswith('ADAPTED_N8N_REPORT_V1=')]
                      if len(frames)!=1: raise GateError('RUNTIME_FRAME_REJECTED')
                      decoded=json.loads(base64.b64decode(frames[0],validate=True))
                      result['engine_report']=decoded
                      validate_engine_report(decoded)
                      state=json.loads(command(['inspect',name]).stdout)[0]['State']
                      if (execution.returncode!=0 or state['ExitCode']!=0 or state['OOMKilled'] or
                          decoded.get('status')!='ADAPTATION_TESTS_COMPLETED' or
                          len(decoded.get('cases',[]))!=14 or decoded.get('adaptation_engine_attempts')!=16 or decoded.get('adaptation_engine_attempts')!=len(decoded.get('runs',[]))):
                          raise GateError('ADAPTATION_TESTS_BLOCKED')
                      result['adaptation_engine_attempts']=decoded['adaptation_engine_attempts']
                      result['proposed_policy_failures']=[case['id'] for case in decoded['cases'] if case['proposed_policy_result']=='FAIL']
                      result['status']='ADAPTATION_TESTS_COMPLETED'
                  except GateError as error: result['blocker']=str(error)
                  except (KeyError,TypeError,ValueError,IndexError,AttributeError): result['blocker']='RESPONSE_REJECTED'
                  finally:
                      if create_attempted:
                          try:
                              command(['rm','--force',name],accept_failure=True)
                              remaining=command(['ps','--all','--filter','name=^/'+name+'$','--format','{{.ID}}']).stdout.strip()
                              result['container_cleanup_confirmed']=remaining==''
                              if remaining: raise GateError('CONTAINER_CLEANUP_FAILED')
                          except GateError:
                              result['container_cleanup_confirmed']=False; result['status']='BLOCKED'
                              result['blocker']='CONTAINER_CLEANUP_FAILED'
              return result

          if __name__=='__main__':
              import sys
              files=globals().get('OWNED_FILES')
              if files is None:
                  files={name:Path(__file__).with_name(name).read_text() for name in ['adapted_adapter.cjs','source_gate.cjs','mock_bridge.cjs','adapted_policy.cjs','runner.cjs','fixtures.json','digest_policy.cjs','adaptation.cjs']}
              report=run_adaptation(files)
              rendered=json.dumps(report,indent=2,sort_keys=True)
              print(rendered)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as output:
                      output.write('## Bounded test adaptation: original source retained\n\n```json\n'+rendered+'\n```\n')
              sys.exit(0 if report['status']=='ADAPTATION_TESTS_COMPLETED' else 2)
          HISTORICAL_PROJECTION_PY
