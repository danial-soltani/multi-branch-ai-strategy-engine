name: Sol Solly environment probe
on:
  push:
    branches: [sol-solly/environment-probe]
    paths: [.github/workflows/sol-solly-environment-probe.yml]
permissions: {}
concurrency:
  group: sol-solly-environment-probe
  cancel-in-progress: false
jobs:
  environment:
    if: github.repository == 'danial-soltani/multi-branch-ai-strategy-engine' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Run owned synthetic workflow through pinned real n8n engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'OWNED_ENGINE_SMOKE_PY'
          OWNED_FILES = {'owned_workflow.json': '{\n  "id": "ownedSmoke001",\n  "name": "owned-synthetic-engine-smoke",\n  "active": false,\n  "nodes": [\n    {\n      "id": "manual",\n      "name": "Manual",\n      "type": "n8n-nodes-base.manualTrigger",\n      "typeVersion": 1,\n      "position": [\n        0,\n        0\n      ],\n      "parameters": {}\n    },\n    {\n      "id": "seed",\n      "name": "Seed",\n      "type": "n8n-nodes-base.set",\n      "typeVersion": 1,\n      "position": [\n        200,\n        0\n      ],\n      "parameters": {\n        "keepOnlySet": true,\n        "values": {\n          "number": [\n            {\n              "name": "amount",\n              "value": 7\n            }\n          ],\n          "string": [\n            {\n              "name": "origin",\n              "value": "owned-synthetic"\n            }\n          ]\n        },\n        "options": {}\n      }\n    },\n    {\n      "id": "calculate",\n      "name": "Calculate",\n      "type": "n8n-nodes-base.set",\n      "typeVersion": 1,\n      "position": [\n        400,\n        0\n      ],\n      "parameters": {\n        "keepOnlySet": false,\n        "values": {\n          "number": [\n            {\n              "name": "doubled",\n              "value": "={{$json.amount * 2}}"\n            }\n          ]\n        },\n        "options": {}\n      }\n    }\n  ],\n  "connections": {\n    "Manual": {\n      "main": [\n        [\n          {\n            "node": "Seed",\n            "type": "main",\n            "index": 0\n          }\n        ]\n      ]\n    },\n    "Seed": {\n      "main": [\n        [\n          {\n            "node": "Calculate",\n            "type": "main",\n            "index": 0\n          }\n        ]\n      ]\n    }\n  },\n  "settings": {\n    "executionOrder": "v1",\n    "timezone": "UTC"\n  }\n}\n', 'adapter.cjs': "'use strict';\nconst crypto = require('node:crypto');\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst assert = require('node:assert/strict');\nconst { createRequire } = require('node:module');\n\nconst EXPECTED_SHA256 = 'f931461001071966068b0bdd29f7aa58d3f13f9a07c0c1c14ba7dcfe18f4fb32';\nconst NODE_KEYS = ['id', 'name', 'parameters', 'position', 'type', 'typeVersion'];\nconst FLOW_KEYS = ['active', 'connections', 'id', 'name', 'nodes', 'settings'];\nconst ALLOWED = new Set(['n8n-nodes-base.manualTrigger', 'n8n-nodes-base.set']);\nconst sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');\nfunction fail(code) { const error = new Error(code); error.code = code; throw error; }\nfunction exactKeys(value, keys) {\n  return value && typeof value === 'object' && !Array.isArray(value) &&\n    JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());\n}\nfunction validateOwnedWorkflow(bytes) {\n  if (!Buffer.isBuffer(bytes)) fail('INPUT_TYPE_REJECTED');\n  if (bytes.length === 0 || bytes.length > 65536) fail('INPUT_SIZE_REJECTED');\n  let workflow;\n  try { workflow = JSON.parse(bytes.toString('utf8')); } catch { fail('INVALID_JSON'); }\n  if (!exactKeys(workflow, FLOW_KEYS) || workflow.active !== false ||\n      !Array.isArray(workflow.nodes) || workflow.nodes.length !== 3) fail('WORKFLOW_SHAPE_REJECTED');\n  for (const node of workflow.nodes) {\n    if (!exactKeys(node, NODE_KEYS)) fail('NODE_FIELD_REJECTED');\n    if (!ALLOWED.has(node.type) || node.typeVersion !== 1) fail('NODE_TYPE_REJECTED');\n  }\n  const digest = sha256(bytes);\n  if (digest !== EXPECTED_SHA256) fail('FIXTURE_HASH_REJECTED');\n  return { workflow, sha256: digest, contract: {\n    kind: 'OWNED_SYNTHETIC_SMOKE_ONLY', library_workflow_execution_allowed: false,\n    operational_use_allowed: false,\n  } };\n}\n\nasync function runEngineSmoke(bytes) {\n  const admitted = validateOwnedWorkflow(bytes); // Before importing any n8n module.\n  const report = {\n    scope: 'OWNED_SYNTHETIC_REAL_N8N_ENGINE_ONLY', status: 'BLOCKED',\n    fixture_sha256: admitted.sha256, engine_loaded: false, expression_engine_observed: null,\n    engine_attempts: 0, successful_synthetic_executions: 0, executions: [],\n    library_workflows_executed: 0, historical_workflow_test_cases_run: 0,\n    operational_use_allowed: false, module_evidence: {}, phase: 'MODULE_LOAD',\n  };\n  let Expression;\n  try {\n    const cliPath = '/usr/local/lib/node_modules/n8n/package.json';\n    const requireN8n = createRequire(cliPath);\n    const expected = { n8n: '2.45.7', 'n8n-core': '2.45.6', 'n8n-workflow': '2.45.4', 'n8n-nodes-base': '2.45.6' };\n    const packages = {};\n    for (const [name, version] of Object.entries(expected)) {\n      const filename = name === 'n8n' ? cliPath : requireN8n.resolve(name + '/package.json');\n      const raw = fs.readFileSync(filename);\n      const metadata = JSON.parse(raw);\n      if (metadata.name !== name || metadata.version !== version) fail('PACKAGE_VERSION_MISMATCH');\n      packages[name] = { filename, root: path.dirname(filename), metadata };\n      report.module_evidence[name] = { version: metadata.version, package_json_path: filename,\n        package_json_sha256: sha256(raw), declared_license: metadata.license ?? 'UNKNOWN' };\n    }\n    if (Number(process.versions.node.split('.')[0]) < 24) fail('NODE_VERSION_MISMATCH');\n    report.node_version = process.versions.node;\n    requireN8n('reflect-metadata');\n    const { Workflow, Expression: RealExpression } = requireN8n('n8n-workflow');\n    const { WorkflowExecute, ExecutionLifecycleHooks } = requireN8n('n8n-core');\n    Expression = RealExpression;\n    if (typeof WorkflowExecute !== 'function' || typeof Workflow !== 'function') fail('ENGINE_API_MISMATCH');\n    const sourceFiles = {\n      workflow_execute: path.join(packages['n8n-core'].root, 'dist/execution-engine/workflow-execute.js'),\n      manual_trigger: path.join(packages['n8n-nodes-base'].root, 'dist/nodes/ManualTrigger/ManualTrigger.node.js'),\n      set_v1: path.join(packages['n8n-nodes-base'].root, 'dist/nodes/Set/v1/SetV1.node.js'),\n    };\n    report.compiled_source_evidence = Object.fromEntries(Object.entries(sourceFiles).map(([key, file]) =>\n      [key, { path: file, sha256: sha256(fs.readFileSync(file)) }]));\n    const { ManualTrigger } = requireN8n(sourceFiles.manual_trigger);\n    const { SetV1 } = requireN8n(sourceFiles.set_v1);\n    const registered = new Map([\n      ['n8n-nodes-base.manualTrigger', new ManualTrigger()],\n      ['n8n-nodes-base.set', new SetV1({})],\n    ]);\n    const nodeTypes = {\n      getByName(name) { if (!registered.has(name)) fail('NODE_REGISTRY_REJECTED'); return registered.get(name); },\n      getByNameAndVersion(name, version) {\n        if (version !== undefined && version !== 1) fail('NODE_REGISTRY_REJECTED');\n        return this.getByName(name);\n      },\n      getKnownTypes() { return Object.fromEntries([...registered].map(([name, type]) => [name, type.description])); },\n    };\n    report.engine_loaded = true;\n    report.phase = 'EXPRESSION_INITIALIZATION';\n    await Expression.initExpressionEngine({ engine: 'vm', poolSize: 1, maxCodeCacheSize: 100,\n      bridgeTimeout: 2000, bridgeMemoryLimit: 128, lazyAcquire: false, nativeEvaluation: false });\n    report.expression_engine_observed = Expression.getActiveImplementation();\n    if (report.expression_engine_observed !== 'vm') fail('EXPRESSION_ENGINE_MISMATCH');\n    report.phase = 'REAL_ENGINE_EXECUTION';\n    for (let iteration = 1; iteration <= 2; iteration++) {\n      const data = JSON.parse(bytes.toString('utf8'));\n      const workflow = new Workflow({ ...data, nodeTypes });\n      const hooks = new ExecutionLifecycleHooks('manual', 'owned-' + iteration, data);\n      const trace = [];\n      hooks.addHandler('nodeExecuteAfter', (name, execution) => trace.push({ name, status: execution.executionStatus }));\n      const deny = () => fail('CAPABILITY_NOT_AVAILABLE_IN_SMOKE');\n      const additionalData = {\n        hooks, currentNodeExecutionIndex: 0, executionId: 'owned-' + iteration,\n        variables: {}, webhookWaitingBaseUrl: 'http://127.0.0.1/unused',\n        formWaitingBaseUrl: 'http://127.0.0.1/unused',\n        instanceBaseUrl: 'http://127.0.0.1', restApiUrl: 'http://127.0.0.1/unused',\n        credentialsHelper: { getDecrypted: deny, getCredentials: deny, getCredentialsProperties: deny,\n          isCredentialUsableByNode: deny },\n        executeWorkflow: deny, startRunnerTask: deny, getRuntimeCredential: deny,\n      };\n      const executor = new WorkflowExecute(additionalData, 'manual');\n      report.engine_attempts++;\n      const run = await executor.run({ workflow });\n      if (run.finished !== true || run.status !== 'success' || run.data.resultData.error) fail('ENGINE_RUN_FAILED');\n      assert.deepEqual(trace, ['Manual', 'Seed', 'Calculate'].map(name => ({ name, status: 'success' })));\n      const output = run.data.resultData.runData.Calculate[0].data.main[0].map(item => item.json);\n      assert.deepEqual(output, [{ amount: 7, origin: 'owned-synthetic', doubled: 14 }]);\n      report.executions.push({ iteration, mode: 'manual', finished: run.finished, status: run.status,\n        node_trace: trace, output, normalized_output_sha256: sha256(JSON.stringify(output)) });\n      report.successful_synthetic_executions++;\n    }\n    if (report.executions[0].normalized_output_sha256 !== report.executions[1].normalized_output_sha256)\n      fail('REPEATABILITY_MISMATCH');\n    report.status = 'SYNTHETIC_REAL_ENGINE_SMOKE_PASS';\n    report.phase = 'COMPLETE';\n  } catch (error) {\n    report.status = 'BLOCKED';\n    report.error_code = error.code || 'ENGINE_ADAPTER_ERROR';\n    report.error_name = String(error.name || 'Error').slice(0, 80);\n    // Inputs and image are fixed/public synthetic; never include a stack or environment dump.\n    report.error_message = String(error.message || 'Engine adapter failed').slice(0, 400);\n  } finally {\n    if (Expression) {\n      try { await Expression.disposeExpressionEngine(); report.expression_cleanup_confirmed = true; }\n      catch { report.status = 'BLOCKED'; report.expression_cleanup_confirmed = false; }\n    }\n  }\n  return report;\n}\nmodule.exports = { EXPECTED_SHA256, validateOwnedWorkflow, runEngineSmoke };\n", 'runner.cjs': "'use strict';\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst { runEngineSmoke } = require('./adapter.cjs');\n(async () => {\n  let report;\n  try { report = await runEngineSmoke(fs.readFileSync(path.join(__dirname, 'owned_workflow.json'))); }\n  catch (error) { report = { scope: 'OWNED_SYNTHETIC_REAL_N8N_ENGINE_ONLY', status: 'BLOCKED',\n    error_code: error.code || 'INPUT_GATE_FAILED', engine_loaded: false,\n    successful_synthetic_executions: 0, library_workflows_executed: 0,\n    historical_workflow_test_cases_run: 0, operational_use_allowed: false }; }\n  const frame = 'OWNED_N8N_REPORT_V1=' + Buffer.from(JSON.stringify(report)).toString('base64') + '\\n';\n  await new Promise(resolve => process.stdout.write(frame, resolve));\n  process.exit(report.status === 'SYNTHETIC_REAL_ENGINE_SMOKE_PASS' ? 0 : 2);\n})();\n"}
          """Run only our pinned synthetic n8n engine adapter in a restricted container."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import uuid

          IMAGE = 'n8nio/n8n@sha256:8e7fd6d66cef92bc0c7c049d456771d9003e9f69f9265c2238ab3f915ddbb080'
          FIXTURE_SHA = 'f931461001071966068b0bdd29f7aa58d3f13f9a07c0c1c14ba7dcfe18f4fb32'
          TMPFS = 'rw,noexec,nosuid,nodev,size=64m,mode=1777'
          OVERRIDES = {'HOME': '/tmp', 'N8N_USER_FOLDER': '/tmp/owned-n8n',
                       'N8N_DIAGNOSTICS_ENABLED': 'false', 'N8N_VERSION_NOTIFICATIONS_ENABLED': 'false',
                       'N8N_TEMPLATES_ENABLED': 'false', 'N8N_COMMUNITY_PACKAGES_ENABLED': 'false'}

          class GateError(Exception): pass

          def env_map(entries):
              result = {}
              for entry in entries:
                  key, value = entry.split('=', 1)
                  if key in result: raise GateError('CONTAINER_CONFIG_REJECTED')
                  result[key] = value
              return result

          def validate_config(info, image_id, source, expected_env):
              def require(condition):
                  if not condition: raise GateError('CONTAINER_CONFIG_REJECTED')
              try:
                  c,h = info['Config'],info['HostConfig']
                  require(info['Image']==image_id and info['State']['Status']=='created')
                  require(c['Image']==IMAGE and c['User']=='1000:1000')
                  require(c['Entrypoint']==['node'] and c['Cmd']==['--no-node-snapshot','/probe/runner.cjs'] and c['WorkingDir']=='/tmp')
                  require(h['NetworkMode']=='none' and h['Privileged'] is False and h['ReadonlyRootfs'] is True)
                  require(h['CapDrop']==['ALL'] and not h.get('CapAdd') and h['SecurityOpt']==['no-new-privileges:true'])
                  require(h['IpcMode']=='none' and h['PidMode']=='')
                  for key,value in {'Memory':2147483648,'MemorySwap':2147483648,'PidsLimit':128,'NanoCpus':1000000000}.items():
                      require(type(h[key]) is int and h[key]==value)
                  for key in ['PortBindings','Devices','DeviceRequests','Binds','VolumesFrom','ExtraHosts']:
                      require(not h.get(key))
                  require(h['Tmpfs']=={'/tmp':TMPFS})
                  mounts=info['Mounts']
                  require(isinstance(mounts,list) and len(mounts) in (1,2))
                  binds=[m for m in mounts if m['Type']=='bind']
                  temporary=[m for m in mounts if m['Type']=='tmpfs']
                  require(len(binds)==1 and len(temporary)<=1 and len(binds)+len(temporary)==len(mounts))
                  require(binds[0]['Source']==source and binds[0]['Destination']=='/probe' and binds[0]['RW'] is False)
                  for mount in temporary:
                      require(mount['Destination']=='/tmp' and not mount.get('Source') and mount['RW'] is True)
                  require(env_map(c['Env'])==expected_env)
                  return True
              except (KeyError,TypeError,ValueError,IndexError,AttributeError):
                  raise GateError('CONTAINER_CONFIG_REJECTED') from None

          def run_smoke(files):
              result={'scope':'RESTRICTED_REAL_N8N_SYNTHETIC_SMOKE', 'status':'BLOCKED', 'image_ref':IMAGE,
                'configuration_gate_passed':False, 'container_cleanup_confirmed':None,
                'engine_report':None, 'library_workflows_executed':0, 'historical_workflow_test_cases_run':0,
                'operational_use_allowed':False, 'sandbox_security_verified':False}
              if set(files)!={'owned_workflow.json','adapter.cjs','runner.cjs'}:
                  return {**result,'blocker':'INPUT_FILE_SET_REJECTED'}
              if hashlib.sha256(files['owned_workflow.json'].encode()).hexdigest()!=FIXTURE_SHA:
                  return {**result,'blocker':'FIXTURE_HASH_REJECTED'}
              result['input_sha256']={name:hashlib.sha256(content.encode()).hexdigest() for name,content in files.items()}
              docker=shutil.which('docker')
              if not docker: return {**result,'blocker':'DOCKER_MISSING'}
              with tempfile.TemporaryDirectory(prefix='owned-engine-') as work:
                  root=Path(work); inputs=root/'probe'; inputs.mkdir(mode=0o755)
                  for name,content in files.items():
                      (inputs/name).write_text(content); (inputs/name).chmod(0o644)
                  client=root/'client'; client.mkdir()
                  clean_env={'PATH':os.defpath,'HOME':str(client),'DOCKER_CONFIG':str(client/'docker'),
                             'HOST_ONLY_MARKER':'synthetic-do-not-forward'}
                  def command(args,timeout=25,accept_failure=False):
                      try:
                          response=subprocess.run([docker,*args],capture_output=True,text=True,timeout=timeout,env=clean_env,check=False)
                      except (OSError,subprocess.TimeoutExpired): raise GateError('DOCKER_COMMAND_ERROR') from None
                      if response.returncode and not accept_failure: raise GateError('DOCKER_COMMAND_FAILED')
                      return response
                  name='sol-solly-owned-engine-'+uuid.uuid4().hex
                  create_attempted=False
                  try:
                      command(['pull','--platform','linux/amd64',IMAGE],timeout=180)
                      image=json.loads(command(['image','inspect',IMAGE]).stdout)[0]
                      image_id=image['Id']
                      if image.get('Os')!='linux' or image.get('Architecture')!='amd64' or not re.fullmatch(r'sha256:[0-9a-f]{64}',image_id):
                          raise GateError('IMAGE_METADATA_REJECTED')
                      if not any(ref.split('@')[-1]==IMAGE.split('@')[1] for ref in image.get('RepoDigests',[])):
                          raise GateError('IMAGE_DIGEST_REJECTED')
                      expected_env=env_map(image['Config'].get('Env',[])); expected_env.update(OVERRIDES)
                      result['image_id']=image_id
                      args=['create','--name='+name,'--pull=never','--platform=linux/amd64','--network=none',
                        '--read-only','--cap-drop=ALL','--security-opt=no-new-privileges:true','--ipc=none',
                        '--memory=2g','--memory-swap=2g','--pids-limit=128','--cpus=1',
                        '--user=1000:1000','--workdir=/tmp','--tmpfs=/tmp:'+TMPFS,
                        '--mount=type=bind,src='+str(inputs)+',dst=/probe,readonly','--entrypoint=node']
                      args.extend('--env='+key+'='+value for key,value in OVERRIDES.items())
                      args.extend([IMAGE,'--no-node-snapshot','/probe/runner.cjs'])
                      create_attempted=True
                      created=command(args).stdout.strip()
                      if not re.fullmatch(r'[0-9a-f]{64}',created): raise GateError('CONTAINER_ID_REJECTED')
                      validate_config(json.loads(command(['inspect',name]).stdout)[0],image_id,str(inputs),expected_env)
                      result['configuration_gate_passed']=True
                      execution=command(['start','--attach',name],timeout=90,accept_failure=True)
                      result['container_process_exit_code']=execution.returncode
                      result['runtime_stdout_sha256']=hashlib.sha256(execution.stdout.encode()).hexdigest()
                      frames=[line[len('OWNED_N8N_REPORT_V1='):] for line in execution.stdout.splitlines() if line.startswith('OWNED_N8N_REPORT_V1=')]
                      if len(frames)!=1: raise GateError('RUNTIME_FRAME_REJECTED')
                      decoded=json.loads(base64.b64decode(frames[0],validate=True))
                      if decoded.get('scope')!='OWNED_SYNTHETIC_REAL_N8N_ENGINE_ONLY' or decoded.get('fixture_sha256')!=FIXTURE_SHA:
                          raise GateError('ENGINE_REPORT_REJECTED')
                      if decoded.get('operational_use_allowed') is not False or decoded.get('library_workflows_executed')!=0:
                          raise GateError('ENGINE_REPORT_REJECTED')
                      result['engine_report']=decoded
                      state=json.loads(command(['inspect',name]).stdout)[0]['State']
                      if (execution.returncode!=0 or state['ExitCode']!=0 or state['OOMKilled'] or
                          decoded.get('status')!='SYNTHETIC_REAL_ENGINE_SMOKE_PASS' or
                          decoded.get('successful_synthetic_executions')!=2):
                          raise GateError('REAL_ENGINE_SMOKE_FAILED')
                      result['status']='SYNTHETIC_REAL_ENGINE_SMOKE_PASS'
                  except GateError as error: result['blocker']=str(error)
                  except (KeyError,TypeError,ValueError,IndexError,AttributeError): result['blocker']='RESPONSE_REJECTED'
                  finally:
                      if create_attempted:
                          try:
                              command(['rm','--force',name],accept_failure=True)
                              remaining=command(['ps','--all','--filter','name=^/'+name+'$','--format','{{.ID}}']).stdout.strip()
                              result['container_cleanup_confirmed']=remaining==''
                              if remaining: raise GateError('CONTAINER_CLEANUP_FAILED')
                          except GateError:
                              result['container_cleanup_confirmed']=False; result['status']='BLOCKED'
                              result['blocker']='CONTAINER_CLEANUP_FAILED'
              return result

          if __name__=='__main__':
              import sys
              files=globals().get('OWNED_FILES')
              if files is None:
                  files={name:Path(__file__).with_name(name).read_text() for name in ['owned_workflow.json','adapter.cjs','runner.cjs']}
              report=run_smoke(files)
              rendered=json.dumps(report,indent=2,sort_keys=True)
              print(rendered)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as output:
                      output.write('## Owned synthetic real n8n engine\n\n```json\n'+rendered+'\n```\n')
              sys.exit(0 if report['status']=='SYNTHETIC_REAL_ENGINE_SMOKE_PASS' else 2)

          OWNED_ENGINE_SMOKE_PY
