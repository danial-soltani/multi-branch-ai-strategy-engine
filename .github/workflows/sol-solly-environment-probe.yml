                      if value.get('ok') is not True or value['record']['binding']!=binding:raise GateError('WORKER_REPORT_REJECTED')
                      raw=json.dumps(value['record'],sort_keys=True,separators=(',',':'),allow_nan=False)
                      if hashlib.sha256(raw.encode()).hexdigest()!=value['record_sha256']:raise GateError('WORKER_CHECKSUM_REJECTED')
                      return value
                  def need(condition,reason):
                      if not condition:raise GateError(reason)
                  def binding(instance):return {'instance_id':instance,'asset_sha':EXPECTED_ADAPTATION_SHA}
                  def blocked_retry(path,b,expected_intent):
                      record=worker('read',path,b)['record'];before=len(result['containers'])
                      need(record==expected_intent,'UNCERTAIN_CHECKPOINT_LINK_REJECTED')
                      denied=worker('begin',path,b,allow_error=True,revision=record['revision'],token=uuid.uuid4().hex)
                      need(denied.get('ok') is False and denied.get('error')=='UNCERTAIN_DELIVERY_REQUIRES_REVIEW' and len(result['containers'])==before,'UNSAFE_AUTOMATIC_RETRY')
                      need(worker('read',path,b)['record']==expected_intent,'UNCERTAIN_CHECKPOINT_CHANGED')
                      return {'blocked':True,'reason':denied['error'],'new_engine_attempts':0,'record':record}
                  try:
                      command(['pull','--platform','linux/amd64',IMAGE],timeout=180)
                      image=json.loads(command(['image','inspect',IMAGE]).stdout)[0];image_id=image['Id']
                      need(image.get('Os')=='linux' and image.get('Architecture')=='amd64' and re.fullmatch(r'sha256:[0-9a-f]{64}',image_id),'IMAGE_METADATA_REJECTED')
                      need(any(x.split('@')[-1]==IMAGE.split('@')[1] for x in image.get('RepoDigests',[])),'IMAGE_DIGEST_REJECTED')
                      result['image_id']=image_id;expected_env=env_map(image['Config'].get('Env',[]));expected_env.update(OVERRIDES)
                      def execute(label,b,path=None,response_fixture='slack_ok.json',kill=False):
                          loaded=worker('read',path,b) if path else None
