                           env={'PATH':os.defpath,'HOME':str(client),'PYTHONDONTWRITEBYTECODE':'1'})
                      value=json.loads(p.stdout)
                      if type(value.get('pid')) is not int or value['pid']==os.getpid() or value.get('operational_use_allowed') is not False:raise GateError('WORKER_REPORT_REJECTED')
                      result['worker_receipts'].append({'operation':op,'checkpoint':path.name,'binding':binding,'exit_code':p.returncode,**value})
                      if p.returncode!=0:
                          if allow_error and value.get('ok') is False:return value
