                  require(env_map(c['Env'])==expected_env)
                  return True
              except (KeyError,TypeError,ValueError,IndexError,AttributeError):
                  raise GateError('CONTAINER_CONFIG_REJECTED') from None

          def run_restart_proof(files):
              result={'scope':'BOUNDED_SQLITE_N8N_RESTART_PROOF','status':'BLOCKED','profile':'owned-checkpoint-restart-v1',
                'image_ref':IMAGE,'source_sha256':SOURCE_SHA,'adaptation_sha256':EXPECTED_ADAPTATION_SHA,
                'containers':[],'worker_receipts':[],'cases':[],'operational_use_allowed':False,
