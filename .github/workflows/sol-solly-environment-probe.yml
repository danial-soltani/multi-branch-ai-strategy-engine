                                  need(row['cleanup_confirmed'],'CONTAINER_CLEANUP_FAILED')
                      baseline1=execute('baseline_1',binding('owned-baseline'));baseline2=execute('baseline_2',binding('owned-baseline'))
                      clean=root/'clean.sqlite3';clean_b=binding('owned-alpha');worker('initialize',clean,clean_b)
                      first=execute('clean_first',clean_b,clean);restarted=execute('clean_restart',clean_b,clean)
                      error_db=root/'error.sqlite3';error_b=binding('owned-error');worker('initialize',error_db,error_b)
                      failed=execute('error_429',error_b,error_db,response_fixture='slack_rate_limit.json');error_block=blocked_retry(error_db,error_b,failed['intent_worker']['record'])
                      crash_db=root/'crash.sqlite3';crash_b=binding('owned-crash');worker('initialize',crash_db,crash_b)
                      killed=execute('crash_ack',crash_b,crash_db,kill=True);crash_block=blocked_retry(crash_db,crash_b,killed['intent_worker']['record'])
                      beta=root/'beta.sqlite3';beta_b=binding('owned-beta');worker('initialize',beta,beta_b);other=execute('isolated_beta',beta_b,beta)
