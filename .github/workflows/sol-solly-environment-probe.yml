name: Sol Solly environment probe
on:
  push:
    branches: [sol-solly/environment-probe]
    paths: [.github/workflows/sol-solly-environment-probe.yml]
permissions: {}
concurrency:
  group: sol-solly-environment-probe
  cancel-in-progress: false
jobs:
  environment:
    if: github.repository == 'danial-soltani/multi-branch-ai-strategy-engine' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Characterize pinned historical projection with offline fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'HISTORICAL_PROJECTION_PY'
          OWNED_FILES = {'historical_adapter.cjs': "'use strict';\nconst fs=require('node:fs'),path=require('node:path'),os=require('node:os'),net=require('node:net');\nconst {createRequire}=require('node:module');\nconst {mock}=require('node:test');\nconst {createBridge}=require('./mock_bridge.cjs');\nconst {SOURCE_SHA,NOW,CUTOFF,sha,makeProjection,clockShim}=require('./source_gate.cjs');\nconst policy=require('./case_policy.cjs');\nconst DATE='Get Yesterdays Date',RSS='Get the RSS Feed',FILTER='If it was published after yesterday',FUNC='Build our message',SLACK='Post to Slack';\nconst deny=()=>{throw new Error('CAPABILITY_NOT_AVAILABLE_IN_HISTORICAL_TEST');};\n\nfunction proxiedContext(context,nodeType,active){\n  const helpers=context.helpers;\n  const network=new Set(['httpRequest','httpRequestWithAuthentication','request','requestWithAuthentication','httpRequestPagination','httpRequestWithAuthenticationPaginate']);\n  const proxyHelpers=new Proxy(helpers,{get(target,key){\n    if(network.has(key)){\n      if(nodeType==='rssFeedRead'&&key==='httpRequest')return active.bridge.httpRequest;\n      if(nodeType==='slack'&&key==='requestWithAuthentication')return active.bridge.requestWithAuthentication;\n      return deny;\n    }\n    const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;\n  }});\n  return new Proxy(context,{get(target,key){\n    if(key==='helpers')return proxyHelpers;\n    const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;\n  }});\n}\n\nasync function egressObservation(){\n  const connection=await new Promise(resolve=>{\n    const socket=net.createConnection({host:'198.51.100.1',port:443});\n    const timer=setTimeout(()=>{socket.destroy();resolve({outcome:'TIMEOUT',error_code:null});},1500);\n    socket.once('connect',()=>{clearTimeout(timer);socket.destroy();resolve({outcome:'UNEXPECTED_CONNECT',error_code:null});});\n    socket.once('error',error=>{clearTimeout(timer);socket.destroy();resolve({outcome:'DENIED',error_code:error.code});});\n  });\n  const processStatus=fs.readFileSync('/proc/self/status','utf8');\n  return {numeric_documentation_address_probe:connection,\n    only_loopback_interfaces:JSON.stringify(Object.keys(os.networkInterfaces()))===JSON.stringify(['lo']),\n    non_root:process.getuid()===1000&&process.getgid()===1000,\n    no_new_privileges:/^NoNewPrivs:\\s+1$/m.test(processStatus),\n    no_effective_capabilities:/^CapEff:\\s+0+$/m.test(processStatus),\n    host_marker_absent:!Object.hasOwn(process.env,'HOST_ONLY_MARKER'),\n    docker_socket_absent:!fs.existsSync('/var/run/docker.sock')};\n}\n\nasync function runHistorical(bytes,fixtures){\n  const input=makeProjection(bytes);\n  const report={scope:'PINNED_HISTORICAL_SOURCE_TEST_PROJECTION',status:'BLOCKED',source_sha256:SOURCE_SHA,\n    projection_sha256:input.projection_sha256,test_projection_changes:input.test_projection_changes,\n    logic_parameters_and_connections_unchanged:input.logic_parameters_and_connections_unchanged,\n    scheduler_activated:false,test_entry_node:DATE,engine_loaded:false,runs:[],cases:[],\n    historical_engine_attempts:0,operational_use_allowed:false,commercial_license_clearance:'UNKNOWN',\n    verification_scope:'CONTROLLED_MOCK_CHARACTERIZATION_ONLY',phase:'LOAD_REAL_RUNTIME'};\n  let Expression;\n  try{\n    const cli='/usr/local/lib/node_modules/n8n/package.json',req=createRequire(cli);\n    const versions={n8n:'2.45.7','n8n-core':'2.45.6','n8n-workflow':'2.45.4','n8n-nodes-base':'2.45.6'};\n    report.module_evidence={};const roots={};\n    for(const [name,version]of Object.entries(versions)){\n      const filename=name==='n8n'?cli:req.resolve(name+'/package.json'),raw=fs.readFileSync(filename),meta=JSON.parse(raw);\n      if(meta.name!==name||meta.version!==version)throw new Error('PACKAGE_VERSION_MISMATCH');\n      roots[name]=path.dirname(filename);report.module_evidence[name]={version:meta.version,package_json_path:filename,sha256:sha(raw),declared_license:meta.license??'UNKNOWN'};\n    }\n    req('reflect-metadata');\n    const api=req('n8n-workflow'),core=req('n8n-core');Expression=api.Expression;\n    report.node_version=process.versions.node;\n    const definitions={cron:['Cron/Cron.node.js','Cron'],dateTime:['DateTime/DateTime.node.js','DateTime'],\n      rssFeedRead:['RssFeedRead/RssFeedRead.node.js','RssFeedRead'],if:['If/If.node.js','If'],\n      function:['Function/Function.node.js','Function'],slack:['Slack/Slack.node.js','Slack']};\n    let active;\n    const types=new Map();report.node_implementation_evidence={};\n    for(const [type,[file,exported]]of Object.entries(definitions)){\n      const filename=path.join(roots['n8n-nodes-base'],'dist/nodes',file);\n      const top=new (req(filename)[exported])();\n      const actual=api.NodeHelpers.getVersionedNodeType(top,1);\n      const wrapped=Object.create(actual);\n      if(typeof actual.execute==='function')wrapped.execute=async function(...args){\n        if(!active)throw new Error('TEST_CONTEXT_MISSING');\n        if(type==='dateTime')active.date_resolution={value:this.getNodeParameter('value',0),\n          timeUnit:this.getNodeParameter('timeUnit',0),dataPropertyName:this.getNodeParameter('dataPropertyName',0)};\n        return await actual.execute.apply(proxiedContext(this,type,active),args);\n      };\n      types.set('n8n-nodes-base.'+type,wrapped);\n      const legacy={dateTime:'DateTime/V1/DateTimeV1.node.js',if:'If/V1/IfV1.node.js',slack:'Slack/V1/SlackV1.node.js'};\n      const implementation=legacy[type]?path.join(roots['n8n-nodes-base'],'dist/nodes',legacy[type]):filename;\n      report.node_implementation_evidence[type]={version:1,loader_path:filename,loader_sha256:sha(fs.readFileSync(filename)),\n        implementation_path:implementation,implementation_sha256:sha(fs.readFileSync(implementation)),\n        execute_present:typeof actual.execute==='function',trigger_present:typeof actual.trigger==='function',\n        helper_interception:['rssFeedRead','slack'].includes(type)?'NETWORK_TRANSPORT_ONLY':'NETWORK_HELPERS_DENIED'};\n    }\n    const nodeTypes={getByName(name){if(!types.has(name))throw new Error('NODE_REGISTRY_REJECTED');return types.get(name);},\n      getByNameAndVersion(name,version){if(version!==undefined&&version!==1)throw new Error('NODE_VERSION_REJECTED');return this.getByName(name);},\n      getKnownTypes(){return Object.fromEntries([...types].map(([name,node])=>[name,node.description]));}};\n    const workflowReq=createRequire(path.join(roots['n8n-workflow'],'package.json'));\n    let location=path.dirname(workflowReq.resolve('@n8n/expression-runtime')),bundle;\n    for(let i=0;i<7;i++){\n      const candidate=path.join(location,'dist/bundle/runtime.iife.js');\n      if(fs.existsSync(candidate)){bundle=candidate;break;}\n      location=path.dirname(location);\n    }\n    if(!bundle)throw new Error('RUNTIME_BUNDLE_NOT_FOUND');\n    const originalBundle=fs.readFileSync(bundle,'utf8'),instrumented=clockShim+originalBundle;\n    report.clock_profile={frozen_now:NOW,cutoff:CUTOFF,timezone:'UTC',host_date_only:'NODE_TEST_MOCK_DATE',\n      vm_date_only:'PREPENDED_TEST_SHIM',original_bundle_path:bundle,original_bundle_sha256:sha(originalBundle),\n      clock_shim_sha256:sha(clockShim),instrumented_bundle_sha256:sha(instrumented),\n      os_clock_frozen:false,engine_files_modified:false};\n    report.engine_loaded=true;report.phase='CLOCK_AND_VM_SETUP';\n    mock.timers.enable({apis:['Date'],now:Date.parse(NOW)});\n    await Expression.initExpressionEngine({engine:'vm',poolSize:1,maxCodeCacheSize:100,bridgeTimeout:3000,\n      bridgeMemoryLimit:128,runtimeBundle:instrumented,nativeEvaluation:false});\n    report.expression_engine_observed=Expression.getActiveImplementation();\n    if(report.expression_engine_observed!=='vm')throw new Error('EXPRESSION_ENGINE_MISMATCH');\n    report.fixture_sha256=Object.fromEntries(Object.entries(fixtures).map(([name,content])=>[name,sha(content)]));\n    report.phase='REAL_HISTORICAL_NODE_EXECUTIONS';\n    const snapshotState=workflow=>workflow.staticData===undefined?null:sha(JSON.stringify(workflow.staticData));\n    async function execute(label,xmlName,responseName='slack_ok.json',existing){\n      const bridge=createBridge({rssXml:fixtures[xmlName],slackResponse:JSON.parse(fixtures[responseName])});\n      active={bridge,date_resolution:null};\n      const workflow=existing??new api.Workflow({...structuredClone(input.projection),nodeTypes});\n      const trace=[],hooks=new core.ExecutionLifecycleHooks('manual','owned-'+label,input.projection);\n      hooks.addHandler('nodeExecuteAfter',(name,data)=>trace.push({name,status:data.executionStatus}));\n      const observation={label,xml_fixture:xmlName,xml_sha256:sha(fixtures[xmlName]),response_fixture:responseName,\n        response_sha256:sha(fixtures[responseName]),source_sha256:SOURCE_SHA,projection_sha256:input.projection_sha256,\n        static_data_before_sha256:snapshotState(workflow),mode:'manual',start_node:DATE};\n      const credentialsHelper={\n        isCredentialUsableByNode:(type,node)=>type==='slackApi'&&node==='n8n-nodes-base.slack',\n        getCredentialsProperties:type=>{if(type!=='slackApi')return deny();return[{name:'accessToken',type:'string',default:''}];},\n        getDecrypted:async(_additional,reference,type)=>{\n          if(reference?.id!=='owned-fixture-slack'||type!=='slackApi')return deny();return{accessToken:'owned-synthetic-not-valid'};\n        },getCredentials:deny};\n      const additional={hooks,currentNodeExecutionIndex:0,executionId:'owned-'+label,variables:{},credentialsHelper,\n        webhookWaitingBaseUrl:'http://127.0.0.1/unused',formWaitingBaseUrl:'http://127.0.0.1/unused',\n        instanceBaseUrl:'http://127.0.0.1',restApiUrl:'http://127.0.0.1/unused',executeWorkflow:deny,startRunnerTask:deny,getRuntimeCredential:deny};\n      report.historical_engine_attempts++;\n      try{\n        const run=await new core.WorkflowExecute(additional,'manual').run({workflow,startNode:workflow.nodes[DATE]});\n        const data=run.data.resultData,items=data.runData[FILTER]?.[0]?.data?.main?.[0];\n        observation.engine_returned_run=true;observation.status=run.status;observation.finished=run.finished??null;\n        observation.last_node=data.lastNodeExecuted??null;\n        observation.error_node=data.error?.node?.name??null;\n        observation.error=data.error?{name:data.error.name??'UNKNOWN',message:String(data.error.message??'UNKNOWN').slice(0,500),description:data.error.description??null,http_code:data.error.httpCode??data.error.statusCode??null}:null;\n        observation.date_output=data.runData[DATE]?.[0]?.data?.main?.[0]?.map(item=>item.json)??null;\n        observation.eligible_guids=Array.isArray(items)?items.map(item=>item.json.guid??'UNKNOWN'):null;\n        observation.eligible_count=Array.isArray(items)?items.length:null;\n      }catch(error){observation.engine_returned_run=false;observation.status='EXCEPTION';\n        observation.error={name:error.name??'UNKNOWN',message:String(error.message??'UNKNOWN').slice(0,500)};}\n      observation.trace=trace;observation.date_resolution=active.date_resolution;observation.transport=bridge.snapshot();\n      observation.static_data_after_sha256=snapshotState(workflow);report.runs.push(observation);return{observation,workflow};\n    }\n    const window=(await execute('window','window.xml')).observation;\n    const duplicates=(await execute('duplicates','duplicates.xml')).observation;\n    const repeatFirst=await execute('repeat_first','baseline.xml');\n    const repeatSecond=(await execute('repeat_second','baseline.xml','slack_ok.json',repeatFirst.workflow)).observation;\n    const empty=(await execute('empty','empty.xml')).observation;\n    const malformed=(await execute('malformed','malformed.xml')).observation;\n    const invalid=(await execute('invalid_date','invalid_date.xml')).observation;\n    const untrusted=(await execute('untrusted_text','untrusted_text.xml')).observation;\n    const missing=(await execute('missing_fields','missing_fields.xml')).observation;\n    const baseline=(await execute('slack_success','baseline.xml')).observation;\n    const limited=(await execute('slack_429','baseline.xml','slack_rate_limit.json')).observation;\n    const rejected=(await execute('slack_error','baseline.xml','slack_error.json')).observation;\n    report.isolation_observation=await egressObservation();\n    const deniedBridge=createBridge({rssXml:'<rss/>',slackResponse:{http_status:200,body:{ok:true}}});\n    try{await deniedBridge.httpRequest({method:'GET',url:'https://unexpected.invalid'});}catch{}\n    report.logical_unknown_request_denied=deniedBridge.snapshot().denied_requests===1;\n    const body=run=>run.transport.calls.find(call=>call.service==='SLACK_FIXTURE')?.body?.text??null;\n    const sent=run=>run.transport.slack_requests;\n    const matches=(value,expected)=>JSON.stringify(value)===JSON.stringify(expected);\n    function entry(id,title,pass,observations,notes){return{id,title,execution_status:pass===null?(id==='T12'?'AWAITING_LOCAL_BINDING':'ATTEMPTED_INCONCLUSIVE'):'EXECUTED',\n      proposed_policy_result:pass===null?'UNKNOWN':pass?'PASS':'FAIL',observations,notes};}\n    const dateValue=window.date_output?.[0]?.data;\n    const clockPass=!!dateValue&&Date.parse(dateValue)===Date.parse(CUTOFF)&&window.date_resolution?.timeUnit==='days'&&\n      window.date_resolution?.dataPropertyName==='data'&&Date.parse(window.date_resolution.value)===Date.parse(NOW);\n    report.cases=[\n      entry('T01','Runtime/source identity and v1 loading',types.size===6,Object.keys(report.node_implementation_evidence),'Cron loaded; scheduler skipped via explicit DateTime entry.'),\n      entry('T02','Date() and DateTime defaults',clockPass,{resolution:window.date_resolution,output:window.date_output},'Test clock instrumentation is explicit, original expression unchanged.'),\n      entry('T03','Date boundary window',policy.succeeded(window,[DATE,RSS,FILTER])&&Array.isArray(window.eligible_guids)?matches(window.eligible_guids,['recent','at_now']):null,{eligible_guids:window.eligible_guids,run:'window'},'Proposed target excludes future and exact lower cutoff.'),\n      entry('T04','Within-run duplicates',policy.succeeded(duplicates,[DATE,RSS,FILTER,FUNC,SLACK])?duplicates.eligible_count===1:null,{eligible_guids:duplicates.eligible_guids,message:body(duplicates)},'No source repair or dedup inserted.'),\n      entry('T05','Repeat-run duplicates',policy.repeat(repeatFirst.observation,repeatSecond),{first_requests:sent(repeatFirst.observation),second_requests:sent(repeatSecond),same_workflow_instance:true},'Same in-memory staticData reused; no claim about database restart persistence.'),\n      entry('T06','Empty feed',policy.empty(empty),{requests:sent(empty),trace:empty.trace},'Records whether downstream Function was reached.'),\n      entry('T07','Malformed XML and invalid pubDate',policy.invalidFeeds(malformed,invalid),\n        {malformed_run:'malformed',invalid_date_run:'invalid_date',invalid_error:invalid.error},'No persistent quarantine implementation inferred from no send.'),\n      entry('T08','Untrusted text and missing fields',policy.succeeded(untrusted,[DATE,RSS,FILTER,FUNC,SLACK])&&policy.succeeded(missing,[DATE,RSS,FILTER])?body(untrusted)!==null&&!/[<]![a-z]+[>]/i.test(body(untrusted))&&sent(missing)===0:null,\n        {untrusted_message:body(untrusted),missing_message:body(missing),missing_requests:sent(missing)},\n        'Proposed policy: escape untrusted Slack markup and require title/link/contentSnippet. Raw token presence is not proof of an actual Slack notification.'),\n      entry('T09','Slack success/request capture',policy.succeeded(baseline,[DATE,RSS,FILTER,FUNC,SLACK])?sent(baseline)===1:null,{run:'slack_success',calls:baseline.transport.calls},'Only synthetic response; no real Slack API.'),\n      entry('T10','Slack error/429 and bounded retries',policy.slackErrors(limited,rejected),\n        {rate_limit_requests:sent(limited),error_requests:sent(rejected),rate_limit_error:limited.error},'Counts at intercepted helper boundary. HTTP-client/server retry and exactly-once delivery unverified.'),\n      entry('T11','Network/secret isolation',Object.entries(report.isolation_observation).filter(([key])=>key!=='numeric_documentation_address_probe').every(([,v])=>v===true)&&\n        report.isolation_observation.numeric_documentation_address_probe.outcome==='DENIED'&&report.logical_unknown_request_denied,\n        report.isolation_observation,'Documentation IP attempted as a denial probe; no application data sent.'),\n      entry('T12','Provenance and authority boundary',null,{runtime_binding:'CLOUD_RECEIPT',hq_order_binding:'LOCAL_POST_RUN_REQUIRED'},'Complete HQ order/contract binding locally without publishing internal records or changing execution_requested=false.')\n    ];\n    report.successful_engine_runs=report.runs.filter(run=>run.status==='success').length;\n    report.error_engine_runs=report.runs.filter(run=>run.status!=='success').length;\n    report.no_unexpected_logical_requests=report.runs.every(run=>run.transport.denied_requests===0);\n    const prerequisites=['T01','T02','T09','T11'].every(id=>report.cases.find(item=>item.id===id).proposed_policy_result==='PASS');\n    report.status=prerequisites&&report.no_unexpected_logical_requests?'CHARACTERIZATION_COMPLETED':'BLOCKED';\n    report.phase='COMPLETE';\n  }catch(error){report.error={name:error.name??'UNKNOWN',message:String(error.message??'UNKNOWN').slice(0,600)};}\n  finally{\n    if(Expression){try{await Expression.disposeExpressionEngine();report.expression_cleanup_confirmed=true;}\n      catch{report.expression_cleanup_confirmed=false;report.status='BLOCKED';}}\n    mock.timers.reset();\n  }\n  return report;\n}\nmodule.exports={runHistorical};\n", 'source_gate.cjs': "'use strict';\nconst {createHash}=require('node:crypto');\nconst SOURCE_SHA='2b365432c86749db19fd7df1f3c37a23b51d81ec92271ab8aa6145574bcb22b3';\nconst NOW='2026-11-01T08:00:00Z',CUTOFF='2026-10-31T08:00:00Z';\nconst sha=value=>createHash('sha256').update(value).digest('hex');\nfunction makeProjection(bytes){\n  if(!Buffer.isBuffer(bytes)||sha(bytes)!==SOURCE_SHA)throw new Error('SOURCE_HASH_REJECTED');\n  const original=JSON.parse(bytes.toString('utf8')),projection=structuredClone(original);\n  const slack=projection.nodes.find(n=>n.type==='n8n-nodes-base.slack');\n  if(projection.nodes.length!==6||!slack||projection.nodes.some(n=>n.typeVersion!==1))throw new Error('SOURCE_SHAPE_REJECTED');\n  slack.credentials={slackApi:{id:'owned-fixture-slack',name:'Owned Synthetic Slack'}};\n  projection.settings={...projection.settings,timezone:'UTC'};\n  const left=structuredClone(original),right=structuredClone(projection);\n  delete left.nodes.find(n=>n.type==='n8n-nodes-base.slack').credentials;\n  delete right.nodes.find(n=>n.type==='n8n-nodes-base.slack').credentials;\n  left.settings={...left.settings,timezone:'UTC'};\n  if(JSON.stringify(left)!==JSON.stringify(right))throw new Error('PROJECTION_LOGIC_CHANGED');\n  return {projection,source_sha256:SOURCE_SHA,projection_sha256:sha(JSON.stringify(projection)),\n    test_projection_changes:[{path:'/nodes[slack]/credentials',replacement:'OWNED_SYNTHETIC_REFERENCE'},\n      {path:'/settings/timezone',replacement:'UTC'}],logic_parameters_and_connections_unchanged:true};\n}\nconst clockShim=`(function(){const NativeDate=globalThis.Date;const fixed=${Date.parse(NOW)};\nfunction FixtureDate(...args){if(new.target)return new NativeDate(...(args.length?args:[fixed]));return new NativeDate(fixed).toString();}\nFixtureDate.prototype=NativeDate.prototype;FixtureDate.now=()=>fixed;FixtureDate.parse=NativeDate.parse;FixtureDate.UTC=NativeDate.UTC;\nglobalThis.Date=FixtureDate;})();\\n`;\nmodule.exports={SOURCE_SHA,NOW,CUTOFF,sha,makeProjection,clockShim};\n", 'mock_bridge.cjs': "'use strict';\nconst { createHash } = require('node:crypto');\nconst digest=value=>createHash('sha256').update(value).digest('hex');\nconst plain=value=>value!==null&&typeof value==='object'&&!Array.isArray(value)&&Object.getPrototypeOf(value)===Object.prototype;\nconst only=(value,keys)=>plain(value)&&Object.keys(value).every(key=>keys.includes(key));\nfunction createBridge({rssXml,slackResponse}) {\n  if(typeof rssXml!=='string'||!only(slackResponse,['http_status','body','headers'])||\n     !Number.isInteger(slackResponse.http_status)||!plain(slackResponse.body)||typeof slackResponse.body.ok!=='boolean')\n    throw new Error('MOCK_CONFIG_REJECTED');\n  const response=structuredClone(slackResponse),calls=[];let rssCount=0,slackCount=0,denied=0;\n  function reject(){denied++;throw new Error('MOCK_REQUEST_REJECTED');}\n  function headers(value,expected){\n    return plain(value)&&Object.entries(value).every(([key,entry])=>\n      Object.hasOwn(expected,key.toLowerCase())&&typeof entry==='string'&&expected[key.toLowerCase()]===entry);\n  }\n  async function httpRequest(options){\n    if(!only(options,['method','url','headers','json','encoding','skipSslCertificateValidation'])||options.method!=='GET'||\n       options.url!=='https://n8n.io/blog/rss'||options.json!==false||options.encoding!=='text'||\n       ![undefined,false].includes(options.skipSslCertificateValidation)||\n       !headers(options.headers,{'user-agent':'rss-parser',accept:'application/rss+xml'}))reject();\n    if(rssCount>=1)throw new Error('MOCK_REQUEST_LIMIT');\n    rssCount++;calls.push({service:'RSS_FIXTURE',response_sha256:digest(rssXml)});return rssXml;\n  }\n  async function requestWithAuthentication(type,options,auth){\n    if(type!=='slackApi'||!only(options,['method','uri','headers','body','json'])||options.method!=='POST'||\n       options.uri!=='https://slack.com/api/chat.postMessage'||options.json!==true||\n       !headers(options.headers,{'content-type':'application/json; charset=utf-8'})||\n       !only(auth,['oauth2'])||!only(auth.oauth2,['tokenType','property'])||\n       auth.oauth2.tokenType!=='Bearer'||auth.oauth2.property!=='authed_user.access_token')reject();\n    const body=options.body;\n    if(!only(body,['channel','text','attachments','blocks','username'])||body.channel!=='#news'||\n       typeof body.text!=='string'||body.text.length>100000||\n       ![undefined,''].includes(body.username)||\n       (body.attachments!==undefined&&(!Array.isArray(body.attachments)||body.attachments.length!==0))||\n       (body.blocks!==undefined&&(!Array.isArray(body.blocks)||body.blocks.length!==0)))reject();\n    if(slackCount>=1)throw new Error('MOCK_REQUEST_LIMIT');\n    slackCount++;calls.push({service:'SLACK_FIXTURE',method:options.method,endpoint:options.uri,\n      body:JSON.parse(JSON.stringify(body)),body_sha256:digest(JSON.stringify(body)),fixture_status:response.http_status});\n    if(response.http_status>=400){const error=new Error('FIXTURE_HTTP_ERROR');error.statusCode=response.http_status;\n      error.headers=structuredClone(response.headers??{});throw error;}\n    return structuredClone(response.body);\n  }\n  function snapshot(){return {scope:'TEST_TRANSPORT_BOUNDARY',rss_requests:rssCount,slack_requests:slackCount,\n    denied_requests:denied,calls:structuredClone(calls),network_operations_implemented:false,operational_use_allowed:false};}\n  return Object.freeze({httpRequest,requestWithAuthentication,snapshot});\n}\nmodule.exports={createBridge};\n", 'case_policy.cjs': "'use strict';\nconst DATE='Get Yesterdays Date',RSS='Get the RSS Feed',FILTER='If it was published after yesterday',FUNC='Build our message',SLACK='Post to Slack';\nconst reached=(run,names)=>names.every(name=>run.trace?.some(node=>node.name===name&&node.status==='success'));\nfunction succeeded(run,names){return run.engine_returned_run===true&&run.status==='success'&&run.finished===true&&!run.error&&\n  run.transport?.rss_requests===1&&run.transport.denied_requests===0&&reached(run,names);}\nfunction errorAt(run,node,upstream){return run.engine_returned_run===true&&!!run.error&&run.transport?.rss_requests===1&&\n  run.transport.denied_requests===0&&(run.error_node??run.last_node)===node&&\n  run.trace?.some(entry=>entry.name===node&&entry.status==='error')&&reached(run,upstream);}\nfunction repeat(first,second){\n  if(!succeeded(first,[DATE,RSS,FILTER,FUNC,SLACK])||!succeeded(second,[DATE,RSS]))return null;\n  return first.transport.slack_requests===1&&second.transport.slack_requests===0;\n}\nfunction invalidFeeds(malformed,invalid){\n  const xmlError=errorAt(malformed,RSS,[DATE])&&/xml|unclosed|close tag|root|non-whitespace/i.test(malformed.error.message);\n  const filtered=succeeded(invalid,[DATE,RSS,FILTER])&&invalid.eligible_count===0;\n  const expectedDateError=errorAt(invalid,FILTER,[DATE,RSS])&&/date|time/i.test(invalid.error.message);\n  if(!xmlError||(!filtered&&!expectedDateError))return null;\n  return malformed.transport.slack_requests===0&&invalid.transport.slack_requests===0;\n}\nfunction slackErrors(rate,logical){\n  const expected=(run,status)=>errorAt(run,SLACK,[DATE,RSS,FILTER,FUNC])&&\n    ['NodeApiError','NodeOperationError'].includes(run.error.name)&&\n    run.transport.calls.filter(call=>call.service==='SLACK_FIXTURE'&&call.fixture_status===status).length===1;\n  if(!expected(rate,429)||!expected(logical,200))return null;\n  return rate.transport.slack_requests===1&&logical.transport.slack_requests===1;\n}\nfunction empty(run){if(!succeeded(run,[DATE,RSS]))return null;return run.transport.slack_requests===0;}\nmodule.exports={succeeded,errorAt,repeat,invalidFeeds,slackErrors,empty};\n", 'runner.cjs': "'use strict';\nconst fs=require('node:fs'),path=require('node:path');\n(async()=>{\n  let report;\n  try{\n    const fixturePath=path.join(__dirname,'fixtures.json'),fixtures=JSON.parse(fs.readFileSync(fixturePath,'utf8'));\n    report=await require('./historical_adapter.cjs').runHistorical(fs.readFileSync(path.join(__dirname,'historical_source.json')),fixtures);\n  }catch(error){report={scope:'PINNED_HISTORICAL_SOURCE_TEST_PROJECTION',status:'BLOCKED',operational_use_allowed:false,error:{name:error.name,message:String(error.message).slice(0,500)}};}\n  await new Promise(resolve=>process.stdout.write('HISTORICAL_N8N_REPORT_V1='+Buffer.from(JSON.stringify(report)).toString('base64')+'\\n',resolve));\n  process.exit(report.status==='CHARACTERIZATION_COMPLETED'?0:2);\n})();\n", 'fixtures.json': '{\n  "window.xml": "<?xml version=\'1.0\' encoding=\'utf-8\'?>\\n<rss version=\\"2.0\\"><channel><title>Synthetic test feed</title><link>https://example.invalid</link><description>Offline fixtures only</description><item><guid>old</guid><title>Old item</title><link>https://example.invalid/posts/old</link><description>Synthetic old</description><pubDate>Sat, 31 Oct 2026 07:59:59 +0000</pubDate></item><item><guid>cutoff</guid><title>At lower boundary</title><link>https://example.invalid/posts/cutoff</link><description>Synthetic cutoff</description><pubDate>Sat, 31 Oct 2026 08:00:00 +0000</pubDate></item><item><guid>recent</guid><title>Recent item</title><link>https://example.invalid/posts/recent</link><description>Synthetic recent</description><pubDate>Sat, 31 Oct 2026 09:00:00 +0000</pubDate></item><item><guid>at_now</guid><title>At clock boundary</title><link>https://example.invalid/posts/at_now</link><description>Synthetic at_now</description><pubDate>Sun, 01 Nov 2026 08:00:00 +0000</pubDate></item><item><guid>future</guid><title>Future item</title><link>https://example.invalid/posts/future</link><description>Synthetic future</description><pubDate>Sun, 01 Nov 2026 08:00:01 +0000</pubDate></item></channel></rss>",\n  "duplicates.xml": "<?xml version=\'1.0\' encoding=\'utf-8\'?>\\n<rss version=\\"2.0\\"><channel><title>Synthetic test feed</title><link>https://example.invalid</link><description>Offline fixtures only</description><item><guid>recent</guid><title>Re