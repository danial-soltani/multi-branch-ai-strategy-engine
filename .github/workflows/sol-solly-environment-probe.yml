                  root=Path(work);template=root/'template';template.mkdir();client=root/'client';client.mkdir()
                  for n,text in files.items():(template/n).write_text(text)
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self,*args,**kwargs):raise GateError('SOURCE_REDIRECT_REJECTED')
