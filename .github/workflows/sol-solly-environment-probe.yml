                          token=uuid.uuid4().hex if path else None
                          request={'schema':'restart-run-v1','label':label,'binding':b,'delivered':record['delivered'],'revision':record['revision'],
                            'intent_id':token,'mode':'kill_after_ack' if kill else 'normal','response_fixture':response_fixture,'operational_use_allowed':False}
                          request_raw=json.dumps(request,sort_keys=True,separators=(',',':'));request_sha=hashlib.sha256(request_raw.encode()).hexdigest()
                          inputs=root/label;inputs.mkdir(mode=0o755)
                          for n,text in files.items():(inputs/n).write_text(text);(inputs/n).chmod(0o644)
                          (inputs/'historical_source.json').write_bytes(source);(inputs/'historical_source.json').chmod(0o644)
                          (inputs/'run_request.json').write_text(request_raw);(inputs/'run_request.json').chmod(0o644)
                          name='sol-solly-restart-'+uuid.uuid4().hex;created_attempted=False
