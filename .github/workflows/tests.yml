name: tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'requirements.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'requirements.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: strategy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check Python syntax
        run: python -m py_compile src/strategy_engine.py
