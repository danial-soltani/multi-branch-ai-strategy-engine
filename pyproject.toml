[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-branch-ai-strategy-engine"
version = "1.0.1"
description = "Generate, evaluate, rank, and synthesize strategic solutions with Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Danial Soltani" }
]
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools]
py-modules = ["strategy_engine"]
package-dir = { "" = "src" }
